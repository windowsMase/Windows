
name: Test GitHub Runner

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Core Settings
        shell: pwsh
        run: |
          Write-Host "Windows runner is ready."
          Write-Host "User: $env:USERNAME"
          Write-Host "Desktop: $env:USERPROFILE\Desktop"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone and Install AWM Cloud Signup
        shell: pwsh
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          $desktop = "$env:USERPROFILE\Desktop"
          $project = "$desktop\awm-cloud-signup"

          New-Item -ItemType Directory -Force -Path $desktop | Out-Null

          if ([string]::IsNullOrWhiteSpace($env:GH_PAT)) {
            throw "GH_PAT secret is missing."
          }

          $auth = [Convert]::ToBase64String(
            [Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_PAT")
          )

          git -c "http.extraheader=AUTHORIZATION: basic $auth" clone `
            https://github.com/maserepo/awm-cloud-signup.git `
            $project

          if ($LASTEXITCODE -ne 0) {
            throw "Git clone failed."
          }

          Set-Location $project

          if (!(Test-Path "package.json")) {
            throw "package.json was not found in the repository."
          }

          if (Test-Path "package-lock.json") {
            npm ci
          } else {
            npm install
          }

          if ($LASTEXITCODE -ne 0) {
            throw "NPM installation failed."
          }

          Write-Host "Repository downloaded and dependencies installed."

      - name: Install Tailscale
        shell: pwsh
        run: |
          $installer = "$env:TEMP\tailscale-setup.exe"
          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
            -OutFile $installer

          Start-Process $installer -ArgumentList "/quiet" -Wait

      - name: Connect to Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw "TAILSCALE_AUTH_KEY secret is missing."
          }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscale up --authkey="$env:TAILSCALE_AUTH_KEY" --hostname="github-windows-runner"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          & $tailscale status

      - name: Keep Runner Alive
        shell: pwsh
        run: |
          Write-Host "Runner is active."
          while ($true) {
            Start-Sleep -Seconds 60
          }
